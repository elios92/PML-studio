name: Windows baseline validation

# Manual-only validation. Automatic push/PR triggers are intentionally
# disabled so development commits never start Actions or send run emails.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish release after successful validation"
        required: true
        default: false
        type: boolean

jobs:
  test-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: source
    permissions:
      contents: write
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: source/go.mod
          cache: false

      - name: Go version
        run: go version

      - name: Verify runtime template
        shell: pwsh
        run: |
          $path = "runtime_templates/plm_runtime_core.zip"
          if (!(Test-Path $path)) { throw "Missing $path" }
          $size = (Get-Item $path).Length
          if ($size -ne 30508129) { throw "Unexpected runtime template size: $size" }

      - name: Run tests
        run: go test ./...

      - name: Vet report
        continue-on-error: true
        run: go vet ./...

      - name: Build PML Studio
        run: go build -trimpath -ldflags="-H=windowsgui" -o "../PML Studio.exe" .

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "..\PML Studio.exe"
          if (!(Test-Path $exe)) { throw "PML Studio.exe was not generated" }
          if ((Get-Item $exe).Length -le 0) { throw "PML Studio.exe is empty" }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v5
        with:
          name: PML-Studio-Windows-x64
          path: PML Studio.exe
          if-no-files-found: error

      - name: Prepare release assets
        if: ${{ inputs.publish_release }}
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "..\PML Studio.exe" -Destination "..\PML.Studio.exe" -Force
          (Get-FileHash -Algorithm SHA256 -LiteralPath "..\PML.Studio.exe").Hash.ToLowerInvariant() + "  PML.Studio.exe" | Set-Content -Encoding ascii "..\PML.Studio.exe.sha256"

      - name: Publish release
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw "version.txt").Trim()
          $tag = "v" + $version
          gh release create $tag "..\PML.Studio.exe" "..\PML.Studio.exe.sha256" --target "${{ github.sha }}" --title "PML Studio $tag" --generate-notes
